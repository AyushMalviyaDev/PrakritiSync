services:
  # AyurSutra Backend API
  - type: web
    name: ayursutra-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: ayursutra-db
          property: connectionString

  # AyurSutra Frontend SPA
  - type: web
    name: ayursutra-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_HOST
        fromService:
          type: web
          name: ayursutra-backend
          property: host

databases:
  - name: ayursutra-db
    databaseName: ayursutra
    user: ayursutra_user
    plan: free
